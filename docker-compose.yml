version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sage_db
      POSTGRES_USER: sage_user
      POSTGRES_PASSWORD: sage_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  qdrant:
    image: qdrant/qdrant:v1.7.0
    ports:
      - '6333:6333'
    volumes:
      - qdrant_storage:/qdrant/storage

  sage:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://sage_user:sage_password@postgres:5432/sage_db
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant

volumes:
  postgres_data:
  qdrant_storage:
